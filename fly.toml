# Fly.io deployment. See docs/runbook.md.
#
# The app name fixes the hostname, and the hostname is hashed into every
# challenge response. Changing it later means updating EBAY_DELETION_ENDPOINT_URL
# and re-saving the endpoint in eBay's developer console.
app = "book-watch-alan"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true

  # Deliberately not scaling to zero. eBay re-validates the deletion endpoint
  # on its own schedule and marks the keyset non-compliant if the check fails,
  # so a cold start that misses the timeout has a cost well beyond one slow
  # request. A continuously running 256MB machine is within the budget.
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# The app's counts, for Fly's Prometheus and Grafana (docs/rules/monitoring.md).
# Collected every 15 seconds. Not under [http_service], so outside traffic
# never reaches it.
[metrics]
  port = 9091
  path = "/metrics"

# The SQLite file lives here, not on the machine's own filesystem, which is
# rebuilt on every deploy.
[mounts]
  source = "book_watch_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
