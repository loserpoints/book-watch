name: Deploy

# Deploys run here rather than from a laptop, so Fly's credentials live in
# GitHub's secret store and never sit on a personal machine. See
# docs/decisions.md entry 18.
#
# Requires two repository secrets:
#   FLY_API_TOKEN            a deploy token, scoped to this app only
#   EBAY_VERIFICATION_TOKEN  the same value set as a secret on Fly

# Manual only, deliberately. Deploying on every push to main had two problems:
# before the secrets exist it fails and leaves main red, and it races CI rather
# than waiting for it — a push could deploy a build CI was about to reject.
# Clicking Run workflow after CI goes green avoids both, and suits a project
# where deploys are rare and the endpoint's uptime is load-bearing.
on:
  workflow_dispatch:

# One deploy at a time. Two overlapping ones can leave the machine running an
# image neither run intended.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Creating the app here rather than through Fly's dashboard: that flow
      # sets up Fly's own GitHub deployment, which would be a second pipeline
      # building this repo on its own schedule and from its own branch.
      # Idempotent, so it is a no-op on every deploy after the first.
      - name: Create the Fly app if it does not exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)
          if flyctl status --app "${app}" > /dev/null 2>&1; then
            echo "App ${app} already exists."
          else
            echo "Creating app ${app}..."
            flyctl apps create "${app}" --org personal
          fi

      # Fly's copy of the settings is pushed from GitHub's rather than typed into
      # Fly's dashboard, so there is one source of truth for the token and the
      # endpoint URL is derived from the same fly.toml the check below reads.
      # That makes the commonest failure — Fly's URL not matching the real one —
      # impossible rather than merely detectable.
      #
      # --stage holds the values for the next deploy instead of triggering one
      # of its own, so a single deploy applies both the settings and the image.
      - name: Give the app its settings
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EBAY_VERIFICATION_TOKEN: ${{ secrets.EBAY_VERIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)
          flyctl secrets set --app "${app}" --stage \
            "EBAY_VERIFICATION_TOKEN=${EBAY_VERIFICATION_TOKEN}" \
            "EBAY_DELETION_ENDPOINT_URL=https://${app}.fly.dev/ebay/deletion"

      # --local-only builds the image on GitHub's runner, which is free, rather
      # than on a Fly builder machine, which is billed as compute. For an image
      # this small the build time is much the same either way.
      # --ha=false stops Fly pairing this with a standby machine. One user, one
      # container, and a spare that nothing starts is cost and drift for no
      # availability anyone would notice. Add it back deliberately if that
      # changes.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --local-only --ha=false

      # --ha=false only governs machines this deploy creates, so the count is
      # enforced separately. Idempotent, and permanent rather than a one-off
      # cleanup: it keeps the invariant true instead of recording that it once
      # was.
      - name: Keep the app at one machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)
          flyctl scale count 1 --app "${app}" --yes

      # The point of this step: a challenge response that does not match is the
      # difference between a working keyset and a disabled one, and it fails
      # silently — eBay just refuses to save. Catching it here means finding out
      # from a red check rather than from a confusing error in eBay's console.
      #
      # It also re-checks on every future deploy, so a changed app name or a
      # rotated token cannot quietly break compliance.
      - name: Verify eBay challenge response
        env:
          EBAY_VERIFICATION_TOKEN: ${{ secrets.EBAY_VERIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)
          url="https://${app}.fly.dev/ebay/deletion"
          code="ci-${GITHUB_RUN_ID}"

          echo "Endpoint: ${url}"

          # The machine may still be booting immediately after a deploy.
          curl -sS --fail --retry 10 --retry-delay 3 --retry-all-errors --retry-connrefused \
            "https://${app}.fly.dev/health" > /dev/null
          echo "Health check passed."

          actual=$(curl -sS --fail --retry 5 --retry-delay 3 --retry-all-errors --retry-connrefused \
            "${url}?challenge_code=${code}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["challengeResponse"])')

          # Values passed through the environment, not argv: argv is visible
          # in the process list, and one of these is the verification token.
          expected=$(EBAY_CODE="${code}" EBAY_URL="${url}" python3 -c 'import hashlib, os; print(hashlib.sha256((os.environ["EBAY_CODE"] + os.environ["EBAY_VERIFICATION_TOKEN"] + os.environ["EBAY_URL"]).encode()).hexdigest())')

          # Hashes are safe to print: they are exactly what eBay receives.
          echo "Returned: ${actual}"
          echo "Expected: ${expected}"

          if [ "${actual}" = "${expected}" ]; then
            echo "MATCH — this endpoint will validate with eBay."
          else
            echo "MISMATCH — eBay will refuse to save this endpoint."
            echo "Most likely EBAY_DELETION_ENDPOINT_URL on Fly does not equal ${url},"
            echo "or the token on Fly differs from the one in GitHub."
            exit 1
          fi
