name: Deploy

# Deploys run here rather than from a laptop, so Fly's credentials live in
# GitHub's secret store and never sit on a personal machine. See
# docs/decisions.md entry 18.
#
# Requires two repository secrets:
#   FLY_API_TOKEN            a deploy token, scoped to this app only
#   EBAY_VERIFICATION_TOKEN  the same value set as a secret on Fly

# Deploys when CI goes green on main, and on demand.
#
# This was manual only, for two reasons. One has expired: the Fly and eBay
# secrets now exist, so a deploy no longer fails for want of them. The other
# was real and is handled here rather than avoided — chaining to CI's
# *completion* rather than to the push means this cannot deploy a build CI was
# about to reject.
#
# What changed the balance was measuring the cost of not doing it. Deploys
# being manual let production sit twelve slices behind main, so the next one
# carried six migrations at once — including the one that rewrites every
# want-list row. Six boring deploys with one suspect each are worth more than
# one interesting deploy with six.
#
# `workflow_dispatch` stays. Redeploying without a commit is worth having when
# a machine needs restarting or a secret has changed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping ones can leave the machine running an
# image neither run intended.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A finished CI run is not a passing one. Without this, a red build on
    # main would deploy itself — which is worse than the manual process this
    # replaces, not better.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Creating the app here rather than through Fly's dashboard: that flow
      # sets up Fly's own GitHub deployment, which would be a second pipeline
      # building this repo on its own schedule and from its own branch.
      # Idempotent, so it is a no-op on every deploy after the first.
      - name: Create the Fly app if it does not exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)
          if flyctl status --app "${app}" > /dev/null 2>&1; then
            echo "App ${app} already exists."
          else
            echo "Creating app ${app}..."
            flyctl apps create "${app}" --org personal
          fi

      # Fly's copy of the settings is pushed from GitHub's rather than typed into
      # Fly's dashboard, so there is one source of truth for the token and the
      # endpoint URL is derived from the same fly.toml the check below reads.
      # That makes the commonest failure — Fly's URL not matching the real one —
      # impossible rather than merely detectable.
      #
      # --stage holds the values for the next deploy instead of triggering one
      # of its own, so a single deploy applies both the settings and the image.
      - name: Give the app its settings
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EBAY_VERIFICATION_TOKEN: ${{ secrets.EBAY_VERIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)
          flyctl secrets set --app "${app}" --stage \
            "EBAY_VERIFICATION_TOKEN=${EBAY_VERIFICATION_TOKEN}" \
            "EBAY_DELETION_ENDPOINT_URL=https://${app}.fly.dev/ebay/deletion" \
            "BOOK_WATCH_DB_PATH=/data/book-watch.db"

      # fly.toml mounts a volume, and a deploy fails outright if it does not
      # exist — so this runs before the deploy, not after.
      #
      # Created only when absent, and that check matters more than it looks: a
      # second volume of the same name is not an error to Fly. It would become
      # a second machine's database, and the want-list would appear to lose
      # entries at random depending on which machine served the request.
      - name: Create the data volume if it does not exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)
          region=$(grep -E '^primary_region *= *' fly.toml | head -1 | cut -d'"' -f2)
          name=$(grep -A2 '^\[mounts\]' fly.toml | grep 'source' | cut -d'"' -f2)

          existing=$(flyctl volumes list --app "${app}" --json \
            | python3 -c 'import json,sys; print(sum(1 for v in json.load(sys.stdin) if v["name"] == sys.argv[1]))' "${name}")

          if [ "${existing}" -gt 0 ]; then
            echo "Volume ${name} already exists (${existing}). Leaving it alone."
          else
            echo "Creating volume ${name} in ${region}."
            flyctl volumes create "${name}" \
              --app "${app}" --region "${region}" --size 1 --yes
          fi

      # --local-only builds the image on GitHub's runner, which is free, rather
      # than on a Fly builder machine, which is billed as compute. For an image
      # this small the build time is much the same either way.
      # --ha=false stops Fly pairing this with a standby machine. One user, one
      # container, and a spare that nothing starts is cost and drift for no
      # availability anyone would notice. Add it back deliberately if that
      # changes.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --local-only --ha=false

      # --ha=false only governs machines this deploy creates, so the count is
      # enforced separately. Idempotent, and permanent rather than a one-off
      # cleanup: it keeps the invariant true instead of recording that it once
      # was.
      - name: Keep the app at one machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)
          flyctl scale count 1 --app "${app}" --yes

      # The point of this step: a challenge response that does not match is the
      # difference between a working keyset and a disabled one, and it fails
      # silently — eBay just refuses to save. Catching it here means finding out
      # from a red check rather than from a confusing error in eBay's console.
      #
      # It also re-checks on every future deploy, so a changed app name or a
      # rotated token cannot quietly break compliance.
      - name: Verify eBay challenge response
        env:
          EBAY_VERIFICATION_TOKEN: ${{ secrets.EBAY_VERIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)
          url="https://${app}.fly.dev/ebay/deletion"
          code="ci-${GITHUB_RUN_ID}"

          echo "Endpoint: ${url}"

          # The machine may still be booting immediately after a deploy.
          curl -sS --fail --retry 10 --retry-delay 3 --retry-all-errors --retry-connrefused \
            "https://${app}.fly.dev/health" > /dev/null
          echo "Health check passed."

          actual=$(curl -sS --fail --retry 5 --retry-delay 3 --retry-all-errors --retry-connrefused \
            "${url}?challenge_code=${code}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["challengeResponse"])')

          # Values passed through the environment, not argv: argv is visible
          # in the process list, and one of these is the verification token.
          expected=$(EBAY_CODE="${code}" EBAY_URL="${url}" python3 -c 'import hashlib, os; print(hashlib.sha256((os.environ["EBAY_CODE"] + os.environ["EBAY_VERIFICATION_TOKEN"] + os.environ["EBAY_URL"]).encode()).hexdigest())')

          # Hashes are safe to print: they are exactly what eBay receives.
          echo "Returned: ${actual}"
          echo "Expected: ${expected}"

          if [ "${actual}" = "${expected}" ]; then
            echo "MATCH — this endpoint will validate with eBay."
          else
            echo "MISMATCH — eBay will refuse to save this endpoint."
            echo "Most likely EBAY_DELETION_ENDPOINT_URL on Fly does not equal ${url},"
            echo "or the token on Fly differs from the one in GitHub."
            exit 1
          fi

      # The step above proves the compliance endpoint works. It proved nothing
      # about search, which is how a deploy with no eBay keys on Fly looked
      # perfectly green while the only page a person uses was broken.
      #
      # This asserts on the HTTP status and never on the page's wording. The
      # route returns 500 when the credentials are missing and 502 when eBay
      # refuses them (src/book_watch/web/listings.py), so a 200 means a search
      # genuinely completed. Deliberately *not* asserting that listings came
      # back: inventory is somebody else's and a title going out of stock must
      # not turn a deploy red.
      #
      # One eBay call per deploy, and deploys are manual and rare.
      - name: Verify search works
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)
          isbn=9780141439518

          body=$(mktemp)
          status=$(curl -sS --max-time 30 -o "${body}" -w '%{http_code}' \
            "https://${app}.fly.dev/search?isbn=${isbn}&limit=5")

          if [ "${status}" != "200" ]; then
            echo "Search returned HTTP ${status}, not 200."
            echo "500 means EBAY_CLIENT_ID / EBAY_CLIENT_SECRET are unset on Fly."
            echo "502 means eBay rejected them — check the Cert ID, and that the"
            echo "keyset is production rather than sandbox."
            echo "--- what the page said ---"
            sed -n 's/.*class="error">\(.*\)<\/p>.*/\1/p' "${body}" | head -3
            exit 1
          fi

          if grep -q "Nothing listed right now" "${body}"; then
            echo "Search worked, but nothing is listed for ${isbn} today."
            echo "The credentials are fine; this is a note, not a failure."
          else
            echo "Search returned listings for ${isbn}."
          fi

      # The want-list is the page a person actually opens, and it is the only
      # one that touches the database — so it is the only check that can catch
      # an unmounted volume, an unset BOOK_WATCH_DB_PATH, or a migration that
      # failed on a volume mounted empty. Searching proves eBay works and says
      # nothing about storage.
      #
      # Status only, again: a 500 is what all three of those look like, and
      # asserting on the page's wording would make a copy edit able to fail a
      # deploy.
      - name: Verify the want-list works
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)

          body=$(mktemp)
          status=$(curl -sS --max-time 30 -o "${body}" -w '%{http_code}' \
            "https://${app}.fly.dev/")

          if [ "${status}" != "200" ]; then
            echo "The want-list returned HTTP ${status}, not 200."
            echo "That page is the only one that opens the database, so this"
            echo "is most likely storage: an unset BOOK_WATCH_DB_PATH, a"
            echo "volume that did not mount, or a failed migration."
            echo "Check: flyctl volumes list, and the [mounts] block in fly.toml."
            exit 1
          fi

          echo "The want-list is serving."

      # The book page is the feature, and until now nothing checked it. It has
      # its own template, its own query across four tables, and a migration
      # behind it — which is exactly the shape of the defects this project has
      # actually had: things that work locally and 500 in the image.
      #
      # It finds a book rather than assuming one. An empty want-list is a
      # perfectly good state and must not fail a deploy.
      - name: Verify the book page works
        run: |
          set -euo pipefail
          app=$(grep -E '^app *= *' fly.toml | head -1 | cut -d'"' -f2)

          list=$(mktemp)
          curl -sS --max-time 30 -o "${list}" "https://${app}.fly.dev/"
          path=$(sed -n 's|.*href="\(/book/[0-9]*\)".*|\1|p' "${list}" | head -1)

          if [ -z "${path}" ]; then
            echo "Nothing on the want-list, so there is no book page to check."
            echo "Not a failure — add a book and the next deploy will check it."
            exit 0
          fi

          body=$(mktemp)
          # Generous timeout: a book whose copies have never been fetched
          # spends one eBay search here, measured at about 1.8 seconds.
          status=$(curl -sS --max-time 45 -o "${body}" -w '%{http_code}' \
            "https://${app}.fly.dev${path}")

          if [ "${status}" != "200" ]; then
            echo "${path} returned HTTP ${status}, not 200."
            echo "The want-list is serving, so the database itself is fine."
            echo "This is the book page: its template, its query across copy /"
            echo "listing_declaration / openlibrary_edition / edition, or a"
            echo "migration that did not reach the image."
            echo "--- what the page said ---"
            sed -n 's/.*class="error">\(.*\)<\/p>.*/\1/p' "${body}" | head -3
            exit 1
          fi

          echo "${path} is serving."
