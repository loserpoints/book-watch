name: CI

# Pull requests plus pushes to main. A PR branch would otherwise run twice for
# the same commit, which buys nothing.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails if uv.lock disagrees with pyproject.toml, so a
      # dependency change without a relock is caught here rather than later.
      - name: Install dependencies
        run: uv sync --locked

      # One script rather than three steps, so that what CI enforces and what
      # a slice's acceptance list tells you to run cannot drift apart. The
      # cost is that a failure shows up as "Check" rather than naming the
      # stage in the job list; the script echoes each stage, so the log still
      # says which one.
      #
      # No eBay keys here: tests marked `network` are deselected by default.
      - name: Check
        run: scripts/check.sh
