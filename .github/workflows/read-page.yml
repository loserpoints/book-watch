name: Read a marketplace page once

# Reads one AbeBooks or Biblio page on the Fly machine, the way the app would,
# and prints what it holds: the status, the page's count of results, the copies
# on it and their delivered prices, and with "markup" ticked, the page itself
# without its scripts and styles, and with "ungrouped" ticked, AbeBooks' page
# asked for without grouped rows. AbeBooks and Biblio pages are public, so the
# public log holds nothing private. A path the site's robots.txt disallows is
# refused before anything is sent. One request per run.
#
# Requires the FLY_API_TOKEN repository secret that Deploy uses.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "An https://www.abebooks.com/book-search/... or https://www.biblio.com/... address."
        required: true
      markup:
        description: "Also print the page's markup, to see a page with no copies."
        type: boolean
        default: false
      ungrouped:
        description: "Ask AbeBooks for the page without grouped rows (rollup=off)."
        type: boolean
        default: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          URL_IN: ${{ inputs.url }}
          MARKUP: ${{ inputs.markup }}
          UNGROUPED: ${{ inputs.ungrouped }}
        run: |
          # The address becomes part of a command on the machine, so only the
          # characters an address of these pages needs get through.
          if ! [[ "${URL_IN}" =~ ^https://www\.(abebooks|biblio)\.com/[A-Za-z0-9/._-]*$ ]]; then
            echo "Use an https://www.abebooks.com/ or https://www.biblio.com/ address with letters, digits and / . _ - only." >&2
            exit 2
          fi
          flag=""
          if [ "${MARKUP}" = "true" ]; then flag=" --markup"; fi
          # A fixed flag, never typed text: the address check above stays strict.
          if [ "${UNGROUPED}" = "true" ]; then flag="${flag} --ungrouped"; fi
          app=$(sed -n 's/^app = "\(.*\)"$/\1/p' fly.toml)
          flyctl ssh console --app "${app}" \
            -C "/app/.venv/bin/python -m book_watch.pages ${URL_IN}${flag}"
