name: Enhancement
description: "Something I could see or do, added, made simpler or taken away"
labels: ["enhancement"]
body:
  - type: textarea
    id: could
    attributes:
      label: What I could do
      description: "One or two sentences, from my side of the screen."
    validations:
      required: true

  - type: textarea
    id: job
    attributes:
      label: Job it advances
      description: "Link the job in docs/jobs.md. If none fits, this is a strategy issue instead."
    validations:
      required: true
